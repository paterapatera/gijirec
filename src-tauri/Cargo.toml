[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unused = "warn"
dead_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"

[workspace.metadata.cargo-machete]
ignored = []
