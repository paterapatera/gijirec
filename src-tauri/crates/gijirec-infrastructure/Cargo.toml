[package]
name = "gijirec-infrastructure"
version.workspace = true
edition.workspace = true

[dependencies]
cpal = "0.16"
gijirec-domain = { path = "../gijirec-domain" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
rtrb = "0.3"
rubato = "0.16"
sha2 = "0.10"
whisper-rs = "0.16"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "10"
whisper-rs = { version = "0.16", features = ["metal"] }

[lints]
workspace = true
