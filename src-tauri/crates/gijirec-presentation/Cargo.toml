[package]
name = "gijirec-presentation"
version.workspace = true
edition.workspace = true

[dependencies]
gijirec-application = { path = "../gijirec-application", features = ["test-support"] }
gijirec-domain = { path = "../gijirec-domain", features = ["contract-test-support"] }
gijirec-infrastructure = { path = "../gijirec-infrastructure" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = "0.15"

[lints]
workspace = true
